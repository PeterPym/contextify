# Nginx configuration for contextify.sh
# Deploy to: /etc/nginx/sites-available/contextify
# Symlink: /etc/nginx/sites-enabled/contextify -> ../sites-available/contextify
#
# Note: SSL configuration is managed by Certbot and added automatically.
# This file shows the base configuration before Certbot modifications.

server {
    server_name contextify.sh www.contextify.sh;

    root /var/www/contextify.sh;
    index index.html;

    # Dedicated access log for contextify.sh (used by GoAccess)
    access_log /var/log/nginx/contextify.access.log;
    error_log /var/log/nginx/contextify.error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # GoAccess stats - password protected
    location /stats/ {
        auth_basic "Analytics";
        auth_basic_user_file /etc/nginx/.htpasswd_stats;
    }

    # GoAccess WebSocket proxy for real-time updates
    location /stats/ws {
        proxy_pass http://127.0.0.1:7890;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        auth_basic "Analytics";
        auth_basic_user_file /etc/nginx/.htpasswd_stats;
    }

    # Static files with caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Blog 404 fallback - redirect missing blog posts to blog index
    location /blog/ {
        try_files $uri $uri/ @blog_fallback;
    }

    location @blog_fallback {
        return 302 /blog/;
    }

    # Newsletter subscription API
    location /api/subscribe {
        proxy_pass http://127.0.0.1:8080/subscribe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # HTML pages (no caching for now)
    location / {
        try_files $uri $uri/ =404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Download tracking redirects (with/without trailing slash)
    # /go/dmg is served as an HTML page (reads /macos-version for dynamic redirect)
    # /go/appstore is a static redirect

    location ~ ^/go/appstore/?$ {
        return 302 https://apps.apple.com/us/app/contextify/id6753190666;
    }

    # Certbot will add SSL configuration below automatically
    # After running: sudo certbot --nginx -d contextify.sh -d www.contextify.sh


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/contextify.sh/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/contextify.sh/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.contextify.sh) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = contextify.sh) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name contextify.sh www.contextify.sh;
    listen 80;
    return 404; # managed by Certbot




}