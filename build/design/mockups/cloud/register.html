<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account - Contextify Cloud</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="dashboard.css" rel="stylesheet">
  <script>
  (function(){
    var t = localStorage.getItem('ctxf-theme') || (window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    document.documentElement.setAttribute('data-bs-theme', t);
  })();
  </script>
</head>
<body>

  <!-- Navbar (minimal, no sidebar) -->
  <nav class="ctxf-navbar navbar navbar-expand">
    <div class="container">
      <a class="navbar-brand ctxf-brand" href="#">
        <i class="bi bi-cloud me-1"></i> Contextify
      </a>
    </div>
  </nav>

  <!-- Auth container -->
  <div class="ctxf-auth-container">
    <div class="ctxf-auth-card">
      <div class="card-body text-center">
        <i class="bi bi-cloud ctxf-auth-icon"></i>
        <h1 class="ctxf-auth-title">Create your account</h1>
        <p class="text-secondary mb-4">Get started with Contextify Cloud.</p>

        <form>
          <div class="mb-3 text-start">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="you@example.com" autocomplete="email">
          </div>
          <div class="mb-3 text-start">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" placeholder="Jane Smith" autocomplete="name">
          </div>
          <div class="mb-4 text-start">
            <label for="teamName" class="form-label">Team name</label>
            <input type="text" class="form-control" id="teamName" placeholder="Acme Engineering">
          </div>
          <button type="submit" class="btn ctxf-btn-primary w-100 mb-3">Create Account</button>
        </form>

        <p class="text-secondary mb-0" style="font-size: 0.875rem;">
          Already have an account? <a href="login.html">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="ctxf-footer">
    <div class="container">
      <div class="row">
        <div class="col-md-4"><div class="ctxf-footer-brand">Contextify</div><p class="ctxf-footer-tagline">AI conversation history for developers.</p></div>
        <div class="col-md-4"><h6 class="ctxf-footer-heading">Product</h6><ul class="list-unstyled ctxf-footer-links"><li><a href="https://contextify.sh/download/">Download</a></li><li><a href="https://contextify.sh/pricing/">Pricing</a></li><li><a href="https://contextify.sh/blog/">Blog</a></li></ul></div>
        <div class="col-md-4"><h6 class="ctxf-footer-heading">Legal</h6><ul class="list-unstyled ctxf-footer-links"><li><a href="https://contextify.sh/privacy/">Privacy</a></li><li><a href="https://contextify.sh/terms/">Terms</a></li><li><a href="https://contextify.sh/support/">Support</a></li></ul></div>
      </div>
      <hr class="ctxf-footer-divider">
      <p class="ctxf-footer-copyright text-center">&copy; 2026 Contextify</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
