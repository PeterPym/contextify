<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contextify Website Color Comparator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; }

    /* Sticky control bar */
    .controls {
      position: sticky;
      top: 0;
      background: #111;
      color: #fff;
      padding: 0.75rem 2rem;
      display: flex;
      gap: 2rem;
      align-items: center;
      z-index: 1000;
      flex-wrap: wrap;
    }
    .controls label { font-weight: 600; margin-right: 0.5rem; }
    .controls button {
      padding: 0.4rem 0.8rem;
      border: 2px solid #444;
      background: transparent;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      min-width: 2rem;
    }
    .controls button:hover { border-color: #888; }
    .controls button.active { background: #fff; color: #111; border-color: #fff; }
    .controls .toggle-group { display: flex; gap: 0.25rem; }
    .controls .key {
      display: inline-block;
      background: #333;
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      font-size: 0.75rem;
      margin-left: 0.25rem;
      font-family: ui-monospace, monospace;
    }
    .controls .hint {
      margin-left: auto;
      opacity: 0.6;
      font-size: 0.8rem;
    }
    .controls .color-chip {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 2px;
      margin-right: 4px;
      vertical-align: middle;
    }

    .specimen { display: none; min-height: 100vh; }
    .specimen.active { display: block; }

    /* Layout */
    .nav { padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    .nav-brand { font-weight: 700; font-size: 1.5rem; text-decoration: none; }
    .nav-links { display: flex; gap: 1.5rem; }
    .nav-links a { text-decoration: none; font-weight: 500; }

    .hero { padding: 4rem 2rem; display: flex; align-items: center; justify-content: center; min-height: 50vh; }
    .hero-content { max-width: 600px; text-align: center; }
    .hero h1 { font-size: 2.5rem; margin-bottom: 1rem; line-height: 1.2; }
    .hero p { font-size: 1.2rem; margin-bottom: 2rem; opacity: 0.9; }

    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      border: 2px solid transparent;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn-secondary { background: transparent; margin-left: 0.5rem; }

    .features { padding: 4rem 2rem; }
    .features h2 { text-align: center; margin-bottom: 2rem; font-size: 1.75rem; }
    .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; max-width: 1000px; margin: 0 auto; }
    .feature-card { padding: 1.5rem; border-radius: 8px; }
    .feature-card h3 { margin-bottom: 0.5rem; font-size: 1.1rem; }

    .footer { padding: 2rem; text-align: center; }
    .footer a { text-decoration: none; margin: 0 1rem; }
    .footer p { margin-top: 1rem; opacity: 0.6; font-size: 0.9rem; }

    /* Swatches - dynamic per direction */
    .swatches { display: flex; gap: 0.25rem; justify-content: center; margin-top: 2rem; flex-wrap: wrap; }
    .swatch { width: 50px; height: 50px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.5rem; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

    /* =========================================================================
       DIRECTION A: Blue (Bootstrap baseline)
       Primary: #4A7BA7 | Complements coral at ~196° (near-complement)
       ========================================================================= */
    .dir-a-light {
      --primary: #4A7BA7; --primary-hover: #3D6A94; --primary-dark: #1E3A52;
      --bg-page: #F5F7FA; --bg-surface: #FFFFFF; --bg-nav: #FFFFFF; --bg-hero: #1E3A52; --bg-footer: #1E3A52;
      --text-page: #2C3E50; --text-hero: #FFFFFF; --text-footer: #FFFFFF; --text-muted: #5D6D7E;
      --link: #4A7BA7; --link-hover: #3D6A94;
      --btn-primary-bg: #4A7BA7; --btn-primary-text: #FFFFFF; --btn-primary-hover: #3D6A94;
      --btn-secondary-border: #4A7BA7; --btn-secondary-text: #4A7BA7;
      --card-bg: #FFFFFF; --card-border: #E8ECF0;
      --border-nav: #E8ECF0;
    }
    .dir-a-dark {
      --primary: #6A9BC7; --primary-hover: #7AABDA; --primary-dark: #0A1420;
      --bg-page: #0F1A24; --bg-surface: #1A2836; --bg-nav: #1A2836; --bg-hero: #0A1420; --bg-footer: #0A1420;
      --text-page: #E8ECF0; --text-hero: #E8ECF0; --text-footer: #E8ECF0; --text-muted: #8A9AAA;
      --link: #6A9BC7; --link-hover: #8ABBDD;
      --btn-primary-bg: #6A9BC7; --btn-primary-text: #0F1A24; --btn-primary-hover: #7AABDA;
      --btn-secondary-border: #6A9BC7; --btn-secondary-text: #6A9BC7;
      --card-bg: #1A2836; --card-border: #2E4254;
      --border-nav: #2E4254;
    }

    /* =========================================================================
       DIRECTION B: Teal
       Primary: #0D9488 | Hue ~175° (split-complement to coral)
       Fresh, modern, distinctive - NOT Bootstrap
       ========================================================================= */
    .dir-b-light {
      --primary: #0D9488; --primary-hover: #0F766E; --primary-dark: #134E4A;
      --bg-page: #F0FDFA; --bg-surface: #FFFFFF; --bg-nav: #FFFFFF; --bg-hero: #134E4A; --bg-footer: #134E4A;
      --text-page: #1F2937; --text-hero: #FFFFFF; --text-footer: #FFFFFF; --text-muted: #4B5563;
      --link: #0D9488; --link-hover: #0F766E;
      --btn-primary-bg: #0D9488; --btn-primary-text: #FFFFFF; --btn-primary-hover: #0F766E;
      --btn-secondary-border: #0D9488; --btn-secondary-text: #0D9488;
      --card-bg: #FFFFFF; --card-border: #D1FAE5;
      --border-nav: #D1FAE5;
    }
    .dir-b-dark {
      --primary: #2DD4BF; --primary-hover: #5EEAD4; --primary-dark: #042F2E;
      --bg-page: #042F2E; --bg-surface: #0D3D3B; --bg-nav: #0D3D3B; --bg-hero: #021716; --bg-footer: #021716;
      --text-page: #E0F2F1; --text-hero: #E0F2F1; --text-footer: #E0F2F1; --text-muted: #80CBC4;
      --link: #2DD4BF; --link-hover: #5EEAD4;
      --btn-primary-bg: #2DD4BF; --btn-primary-text: #042F2E; --btn-primary-hover: #5EEAD4;
      --btn-secondary-border: #2DD4BF; --btn-secondary-text: #2DD4BF;
      --card-bg: #0D3D3B; --card-border: #1A4A48;
      --border-nav: #1A4A48;
    }

    /* =========================================================================
       DIRECTION C: Emerald
       Primary: #059669 | Hue ~160° (split-complement to coral)
       Sophisticated, calm, premium feel
       ========================================================================= */
    .dir-c-light {
      --primary: #059669; --primary-hover: #047857; --primary-dark: #064E3B;
      --bg-page: #F0FDF4; --bg-surface: #FFFFFF; --bg-nav: #FFFFFF; --bg-hero: #064E3B; --bg-footer: #064E3B;
      --text-page: #1F2937; --text-hero: #FFFFFF; --text-footer: #FFFFFF; --text-muted: #4B5563;
      --link: #059669; --link-hover: #047857;
      --btn-primary-bg: #059669; --btn-primary-text: #FFFFFF; --btn-primary-hover: #047857;
      --btn-secondary-border: #059669; --btn-secondary-text: #059669;
      --card-bg: #FFFFFF; --card-border: #D1FAE5;
      --border-nav: #D1FAE5;
    }
    .dir-c-dark {
      --primary: #34D399; --primary-hover: #6EE7B7; --primary-dark: #022C22;
      --bg-page: #022C22; --bg-surface: #064E3B; --bg-nav: #064E3B; --bg-hero: #011812; --bg-footer: #011812;
      --text-page: #D1FAE5; --text-hero: #D1FAE5; --text-footer: #D1FAE5; --text-muted: #6EE7B7;
      --link: #34D399; --link-hover: #6EE7B7;
      --btn-primary-bg: #34D399; --btn-primary-text: #022C22; --btn-primary-hover: #6EE7B7;
      --btn-secondary-border: #34D399; --btn-secondary-text: #34D399;
      --card-bg: #064E3B; --card-border: #0A6E50;
      --border-nav: #0A6E50;
    }

    /* =========================================================================
       DIRECTION D: Violet
       Primary: #7C3AED | Hue ~263° (triadic to coral)
       Bold, distinctive, creative
       ========================================================================= */
    .dir-d-light {
      --primary: #7C3AED; --primary-hover: #6D28D9; --primary-dark: #4C1D95;
      --bg-page: #FAF5FF; --bg-surface: #FFFFFF; --bg-nav: #FFFFFF; --bg-hero: #4C1D95; --bg-footer: #4C1D95;
      --text-page: #1F2937; --text-hero: #FFFFFF; --text-footer: #FFFFFF; --text-muted: #4B5563;
      --link: #7C3AED; --link-hover: #6D28D9;
      --btn-primary-bg: #7C3AED; --btn-primary-text: #FFFFFF; --btn-primary-hover: #6D28D9;
      --btn-secondary-border: #7C3AED; --btn-secondary-text: #7C3AED;
      --card-bg: #FFFFFF; --card-border: #EDE9FE;
      --border-nav: #EDE9FE;
    }
    .dir-d-dark {
      --primary: #A78BFA; --primary-hover: #C4B5FD; --primary-dark: #1E1033;
      --bg-page: #1E1033; --bg-surface: #2E1A4A; --bg-nav: #2E1A4A; --bg-hero: #0F0820; --bg-footer: #0F0820;
      --text-page: #EDE9FE; --text-hero: #EDE9FE; --text-footer: #EDE9FE; --text-muted: #C4B5FD;
      --link: #A78BFA; --link-hover: #C4B5FD;
      --btn-primary-bg: #A78BFA; --btn-primary-text: #1E1033; --btn-primary-hover: #C4B5FD;
      --btn-secondary-border: #A78BFA; --btn-secondary-text: #A78BFA;
      --card-bg: #2E1A4A; --card-border: #4C2A7A;
      --border-nav: #4C2A7A;
    }

    /* =========================================================================
       DIRECTION E: Deep Teal (darker, more premium)
       Primary: #0F766E | Hue ~175° (split-complement)
       Premium, understated, professional
       ========================================================================= */
    .dir-e-light {
      --primary: #0F766E; --primary-hover: #115E59; --primary-dark: #134E4A;
      --bg-page: #FAFAFA; --bg-surface: #FFFFFF; --bg-nav: #FFFFFF; --bg-hero: #115E59; --bg-footer: #115E59;
      --text-page: #18181B; --text-hero: #FFFFFF; --text-footer: #FFFFFF; --text-muted: #52525B;
      --link: #0F766E; --link-hover: #115E59;
      --btn-primary-bg: #0F766E; --btn-primary-text: #FFFFFF; --btn-primary-hover: #115E59;
      --btn-secondary-border: #0F766E; --btn-secondary-text: #0F766E;
      --card-bg: #FFFFFF; --card-border: #E4E4E7;
      --border-nav: #E4E4E7;
    }
    .dir-e-dark {
      --primary: #14B8A6; --primary-hover: #2DD4BF; --primary-dark: #042F2E;
      --bg-page: #18181B; --bg-surface: #27272A; --bg-nav: #27272A; --bg-hero: #0C0C0D; --bg-footer: #0C0C0D;
      --text-page: #FAFAFA; --text-hero: #FAFAFA; --text-footer: #FAFAFA; --text-muted: #A1A1AA;
      --link: #14B8A6; --link-hover: #2DD4BF;
      --btn-primary-bg: #14B8A6; --btn-primary-text: #042F2E; --btn-primary-hover: #2DD4BF;
      --btn-secondary-border: #14B8A6; --btn-secondary-text: #14B8A6;
      --card-bg: #27272A; --card-border: #3F3F46;
      --border-nav: #3F3F46;
    }

    /* =========================================================================
       DIRECTION F: Slate + Teal accent
       Neutral gray base with teal for actions only
       Minimal, modern, Apple-ish
       ========================================================================= */
    .dir-f-light {
      --primary: #0D9488; --primary-hover: #0F766E; --primary-dark: #1E293B;
      --bg-page: #F8FAFC; --bg-surface: #FFFFFF; --bg-nav: #FFFFFF; --bg-hero: #1E293B; --bg-footer: #1E293B;
      --text-page: #1E293B; --text-hero: #FFFFFF; --text-footer: #FFFFFF; --text-muted: #64748B;
      --link: #0D9488; --link-hover: #0F766E;
      --btn-primary-bg: #0D9488; --btn-primary-text: #FFFFFF; --btn-primary-hover: #0F766E;
      --btn-secondary-border: #64748B; --btn-secondary-text: #64748B;
      --card-bg: #FFFFFF; --card-border: #E2E8F0;
      --border-nav: #E2E8F0;
    }
    .dir-f-dark {
      --primary: #2DD4BF; --primary-hover: #5EEAD4; --primary-dark: #0F172A;
      --bg-page: #0F172A; --bg-surface: #1E293B; --bg-nav: #1E293B; --bg-hero: #020617; --bg-footer: #020617;
      --text-page: #F1F5F9; --text-hero: #F1F5F9; --text-footer: #F1F5F9; --text-muted: #94A3B8;
      --link: #2DD4BF; --link-hover: #5EEAD4;
      --btn-primary-bg: #2DD4BF; --btn-primary-text: #0F172A; --btn-primary-hover: #5EEAD4;
      --btn-secondary-border: #94A3B8; --btn-secondary-text: #94A3B8;
      --card-bg: #1E293B; --card-border: #334155;
      --border-nav: #334155;
    }

    /* =========================================================================
       DIRECTION G: Warm Slate + Emerald
       Slightly warm gray with green accents
       Approachable, professional
       ========================================================================= */
    .dir-g-light {
      --primary: #059669; --primary-hover: #047857; --primary-dark: #292524;
      --bg-page: #FAFAF9; --bg-surface: #FFFFFF; --bg-nav: #FFFFFF; --bg-hero: #292524; --bg-footer: #292524;
      --text-page: #292524; --text-hero: #FFFFFF; --text-footer: #FFFFFF; --text-muted: #78716C;
      --link: #059669; --link-hover: #047857;
      --btn-primary-bg: #059669; --btn-primary-text: #FFFFFF; --btn-primary-hover: #047857;
      --btn-secondary-border: #78716C; --btn-secondary-text: #78716C;
      --card-bg: #FFFFFF; --card-border: #E7E5E4;
      --border-nav: #E7E5E4;
    }
    .dir-g-dark {
      --primary: #34D399; --primary-hover: #6EE7B7; --primary-dark: #1C1917;
      --bg-page: #1C1917; --bg-surface: #292524; --bg-nav: #292524; --bg-hero: #0C0A09; --bg-footer: #0C0A09;
      --text-page: #FAFAF9; --text-hero: #FAFAF9; --text-footer: #FAFAF9; --text-muted: #A8A29E;
      --link: #34D399; --link-hover: #6EE7B7;
      --btn-primary-bg: #34D399; --btn-primary-text: #1C1917; --btn-primary-hover: #6EE7B7;
      --btn-secondary-border: #A8A29E; --btn-secondary-text: #A8A29E;
      --card-bg: #292524; --card-border: #44403C;
      --border-nav: #44403C;
    }

    /* =========================================================================
       DIRECTION H: Indigo (blue-violet, more distinctive than pure blue)
       Primary: #6366F1 | Hue ~239°
       Modern, tech-forward but not Bootstrap blue
       ========================================================================= */
    .dir-h-light {
      --primary: #6366F1; --primary-hover: #4F46E5; --primary-dark: #312E81;
      --bg-page: #F5F3FF; --bg-surface: #FFFFFF; --bg-nav: #FFFFFF; --bg-hero: #312E81; --bg-footer: #312E81;
      --text-page: #1F2937; --text-hero: #FFFFFF; --text-footer: #FFFFFF; --text-muted: #4B5563;
      --link: #6366F1; --link-hover: #4F46E5;
      --btn-primary-bg: #6366F1; --btn-primary-text: #FFFFFF; --btn-primary-hover: #4F46E5;
      --btn-secondary-border: #6366F1; --btn-secondary-text: #6366F1;
      --card-bg: #FFFFFF; --card-border: #E0E7FF;
      --border-nav: #E0E7FF;

      --link: #818CF8; --link-hover: #A5B4FC;
      --btn-primary-bg: #818CF8; --btn-primary-text: #1E1B4B; --btn-primary-hover: #A5B4FC;
      --btn-secondary-border: #818CF8; --btn-secondary-text: #818CF8;
      --card-bg: #312E81; --card-border: #4338CA;
      --border-nav: #4338CA;
    }

    /* =========================================================================
       Apply variables
       ========================================================================= */
    .specimen { background: var(--bg-page); color: var(--text-page); }
    .specimen .nav { background: var(--bg-nav); border-bottom: 1px solid var(--border-nav); }
    .specimen .nav-brand { color: var(--text-page); }
    .specimen .nav-links a { color: var(--text-muted); }
    .specimen .nav-links a:hover { color: var(--link); }

    .specimen .hero { background: var(--bg-hero); color: var(--text-hero); }
    .specimen .hero h1 { color: var(--text-hero); }

    .specimen .btn-primary { background: var(--btn-primary-bg); color: var(--btn-primary-text); }
    .specimen .btn-primary:hover { background: var(--btn-primary-hover); }
    .specimen .btn-secondary { border-color: var(--btn-secondary-border); color: var(--btn-secondary-text); }

    .specimen .features { background: var(--bg-page); }
    .specimen .features h2 { color: var(--text-page); }
    .specimen .feature-card { background: var(--card-bg); border: 1px solid var(--card-border); }
    .specimen .feature-card h3 { color: var(--text-page); }
    .specimen .feature-card p { color: var(--text-muted); }

    .specimen .footer { background: var(--bg-footer); color: var(--text-footer); }
    .specimen .footer a { color: var(--text-footer); opacity: 0.8; }
    .specimen .footer a:hover { opacity: 1; }

    /* Dynamic swatch based on primary */
    .specimen .swatch-primary { background: var(--primary); }
  </style>
</head>

const directions = {

// Populate all specimens
['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'].forEach(dir => {
  ['light', 'dark'].forEach(mode => {
    document.getElementById(`specimen-${dir}-${mode}`).innerHTML = contentTemplate;
  });
});

let currentDir = 'a';
let currentMode = 'light';

function updateHint(dir) {
  const d = directions[dir];
  document.getElementById('hint').innerHTML =
    `<span class="color-chip" style="background:${d.hex}"></span>${d.label} - ${d.desc}`;
}

function setDir(dir) {
  currentDir = dir;
  updateView();
  ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'].forEach(d => {
    document.getElementById(`btn-${d}`).classList.toggle('active', d === dir);
  });
  updateHint(dir);
}

function setMode(mode) {
  currentMode = mode;
  updateView();
  document.getElementById('btn-light').classList.toggle('active', mode === 'light');
  document.getElementById('btn-dark').classList.toggle('active', mode === 'dark');
}

function updateView() {
  document.querySelectorAll('.specimen').forEach(s => s.classList.remove('active'));
  document.getElementById(`specimen-${currentDir}-${currentMode}`).classList.add('active');
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'].includes(key)) {
    setDir(key);
  } else if (key === 'l') {
    setMode('light');
  } else if (key === 'k') {
    setMode('dark');
  }
});

// Initialize
updateHint('a');
updateView();
</script>
