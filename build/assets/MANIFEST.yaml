assets:
  # Website images (symlinked at build/assets/website/)
  - id: hero-dark
    path: website/assets/img/contextify-screenshot-dark.png
    type: screenshot
    app_version: "1.0.0"
    purpose: [website, social, docs]
    keywords: [hero, main, dark, timeline]
    has_webp: true

  - id: hero-light
    path: website/assets/img/contextify-screenshot-light.png
    type: screenshot
    app_version: "1.0.0"
    purpose: [website, social]
    keywords: [hero, main, light]
    has_webp: true

  - id: feature-search
    path: website/assets/img/feature-search-cropped.png
    type: screenshot
    app_version: "1.0.0"
    purpose: [website, social, docs]
    keywords: [search, query, find]
    has_webp: true

  - id: feature-sync
    path: website/assets/img/feature-sync-cropped.png
    type: screenshot
    app_version: "1.0.0"
    purpose: [website]
    keywords: [sync, realtime, monitoring]
    has_webp: true

  - id: feature-timeline
    path: website/assets/img/feature-timeline-cropped.png
    type: screenshot
    app_version: "1.0.0"
    purpose: [website]
    keywords: [timeline, history]
    has_webp: true

  - id: og-banner
    path: website/assets/img/og-banner.png
    type: social
    app_version: "1.0.0"
    purpose: [og, social]
    keywords: [og, opengraph, preview]
    has_webp: false
    notes: "Keep PNG - some platforms prefer it for OG"

  - id: apple-intelligence-badge
    path: website/assets/img/apple-intelligence-macos-tahoe.png
