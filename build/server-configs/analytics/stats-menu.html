<!DOCTYPE html>
<html>
<head>
    <title>Contextify Stats</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background: #1a1a2e; color: #eee; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; }
        h1 { color: #fff; margin-bottom: 0.5rem; }
        .subtitle { color: #888; margin-bottom: 2rem; font-size: 0.9rem; }
        .links { display: flex; flex-direction: column; gap: 1rem; }
        a { display: block; padding: 1rem 2rem; background: #16213e; color: #fff; text-decoration: none; border-radius: 8px; font-size: 1.1rem; transition: background 0.2s; }
        a:hover { background: #0f3460; }
        .live { background: #065f46; }
        .live:hover { background: #047857; }
        .today { background: #4a47a3; }
        .today:hover { background: #5c5ac7; }
        .desc { font-size: 0.8rem; color: #aaa; margin-top: 0.3rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contextify Analytics</h1>
        <p class="subtitle">contextify.sh</p>
        <div class="links">
            <a href="live.html" class="live">
                Live (Last Hour)
                <div class="desc">Minute-by-minute, updates every 30s</div>
            </a>
            <a href="today.html" class="today">
                Today
                <div class="desc">Full day stats, updates every minute</div>
            </a>
            <a href="index.html">
                All Time
                <div class="desc">Historical data, real-time WebSocket</div>
            </a>
        </div>
    </div>
</body>
</html>
