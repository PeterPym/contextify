# GoAccess config - GA-style dashboard
# Location: /etc/goaccess/goaccess.conf

# Log format
log-format COMBINED

# Exclude owner IPs (update as needed)
exclude-ip 23.234.81.210
exclude-ip 75.164.244.171

# Filter out noise
ignore-crawlers true
ignore-status 400
ignore-status 401
ignore-status 403
ignore-status 404
ignore-status 429
ignore-status 500
ignore-status 502
ignore-status 503

# Hide technical panels (keep it GA-like)
ignore-panel HOSTS
ignore-panel REQUESTS_STATIC
ignore-panel NOT_FOUND
ignore-panel KEYPHRASES
ignore-panel STATUS_CODES
ignore-panel CACHE_STATUS
ignore-panel MIME_TYPE
ignore-panel TLS_TYPE
ignore-panel REMOTE_USER

# Display settings
max-items 15
4xx-to-unique-count false
