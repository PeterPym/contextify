# project-config.yaml
# Source of truth for project settings

# ─────────────────────────────────────────────────────────────────
# Identity
# ─────────────────────────────────────────────────────────────────
schema_version: 1
repo: contextify
description: macOS SwiftUI HUD for AI sessions

# ─────────────────────────────────────────────────────────────────
# Cross-Project Availability
# Make this project's AI artifacts available across all your projects
# ─────────────────────────────────────────────────────────────────

cross_project_availability:
  skills: none

# ─────────────────────────────────────────────────────────────────
# Task Management
# ─────────────────────────────────────────────────────────────────
task:
  type: bloon

# ─────────────────────────────────────────────────────────────────
# Git Workflow
# ─────────────────────────────────────────────────────────────────
canonical_branch: main
remote: origin

sync:
  strategy: merge
  push_landing: false
  push_to_canonical: true

hooks:
  pre_sync_all: null
  post_sync_all: null
  pre_sync: null
  post_sync: null
  post_init:
    - /Users/rob/code/projects/cli-ai-setup/utils/gitops/hooks/setup-worktree.sh
    - /Users/rob/code/projects/cli-ai-setup/utils/gitops/hooks/post-init-color.sh

# ─────────────────────────────────────────────────────────────────
# iTerm2 Tab Colors
# ─────────────────────────────────────────────────────────────────
# Custom palette using Contextify brand colors
color_palette:
  - "#F9B233"  # Brand Yellow (orange-ish) - from logomark left loop
  - "#4AC4E0"  # Brand Cyan - from logomark center
  - "#8B5CF6"  # Brand Purple - from logomark right loop
  - "#4A7BA7"  # Contextify Primary - darker blue
  - "#51A86B"  # Contextify Success - green
  - "#9C88C8"  # Contextify Accent (dark mode) - lighter purple

# ─────────────────────────────────────────────────────────────────
# Worktrees
# ─────────────────────────────────────────────────────────────────
worktrees:
  - name: primary
    path: ~/code/projects/contextify
    landing_branch: main
    meta:
      color: "#F9B233"  # Brand Yellow (orange-ish)

  - name: wb1
    path: ~/code/projects/contextify-wb1
    landing_branch: main-wb1
    meta:
      color: "#4AC4E0"  # Brand Cyan

  - name: wb2
    path: ~/code/projects/contextify-wb2
    landing_branch: main-wb2
    meta:
      color: "#8B5CF6"  # Brand Purple

  - name: wb3
    path: ~/code/projects/contextify-wb3
    landing_branch: main-wb3
    meta:
      color: "#4A7BA7"  # Contextify Primary (darker blue)

  - name: wb4
    path: ~/code/projects/contextify-wb4
    landing_branch: main-wb4
    meta:
      color: "#9C88C8"  # Contextify Accent (lighter purple)


  - name: worker-bee
    path: ~/code/projects/contextify-worker-bee
    landing_branch: main
    archived: true
    meta:
      archived_date: "2026-01-02"
      note: "Replaced by wb1/wb2 naming convention"

# ─────────────────────────────────────────────────────────────────
# Paired Repository
# When working cross-repo, AI agents must use the matching worktree
# number (e.g. contextify-wb3 <-> contextify-cloud-wb3).
# ─────────────────────────────────────────────────────────────────
paired_repo:
  name: contextify-cloud
  config: ~/code/projects/contextify-cloud/project-config.yaml
  worktree_prefix: contextify-cloud
