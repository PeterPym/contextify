name: Live Systems Validation

on:
  schedule:
    # Daily at 2pm UTC (7am PT / 10am ET)
    - cron: '0 14 * * *'
  workflow_dispatch:

# Only one validation run at a time
concurrency:
  group: live-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Required for creating/updating issues
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run live systems validation
        id: validate
        run: |
          set -euo pipefail

          # Run validation, capture output regardless of exit code
          EXIT_CODE=0
          bash scripts/validate-live-systems.sh --json --no-color > /tmp/validation-output.json 2>&1 || EXIT_CODE=$?

          # Store results for downstream steps
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Render step summary
          if [ $EXIT_CODE -eq 0 ]; then
            echo "### Live Systems Validation: PASSED :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Live Systems Validation: FAILED :x:" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

          python3 -c "
          import json, sys
          with open('/tmp/validation-output.json') as f:
              data = json.load(f)
          print(f'**Run time:** {data[\"timestamp\"]}')
          print(f'**Passed:** {data[\"passed\"]} | **Failed:** {data[\"failed\"]}')
          if data.get('versions'):
              v = data['versions']
              print(f'**Versions:** macOS {v.get(\"macos_version\",\"?\")} | CLI {v.get(\"cli_version\",\"?\")} | Sparkle {v.get(\"sparkle_version\",\"?\")}')
          print()
          for section_name, section in data['sections'].items():
              print(f'#### {section_name.title()}')
              print('| Check | Status | Detail |')
              print('|-------|--------|--------|')
              for check in section['checks']:
                  icon = ':white_check_mark:' if check['status'] == 'pass' else (':x:' if check['status'] == 'fail' else ':warning:')
                  print(f'| {check[\"id\"]} {check[\"name\"]} | {icon} | {check.get(\"detail\", \"\")} |')
              print()
          " >> "$GITHUB_STEP_SUMMARY"

          exit $EXIT_CODE

      - name: Create or update failure issue
        if: failure() && steps.validate.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let data;
            try {
              const rawOutput = fs.readFileSync('/tmp/validation-output.json', 'utf8');
              data = JSON.parse(rawOutput);
            } catch (e) {
              data = { status: 'error', sections: {}, timestamp: new Date().toISOString() };
            }

            // Collect failed checks
            const failures = [];
            for (const [section, info] of Object.entries(data.sections || {})) {
              for (const check of (info.checks || [])) {
                if (check.status === 'fail') {
                  failures.push(`- **${check.id}** ${check.name}: ${check.detail || 'failed'}`);
                }
              }
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const timestamp = data.timestamp || new Date().toISOString();
            const failureList = failures.join('\n');
            const label = 'live-validation-failure';

            // Ensure label exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label
              });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: 'e11d48',
                  description: 'Automated live systems validation failure'
                });
              }
            }

            // Search for existing open issue with our label
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 1
            });

            if (existingIssues.length > 0) {
              // Add comment to existing issue
              const issueNumber = existingIssues[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: [
                  `## Validation failure: ${timestamp}`,
                  '',
                  `**Run:** ${runUrl}`,
                  `**Failed checks:** ${failures.length}`,
                  '',
                  failureList,
                ].join('\n')
              });
              core.info(`Added comment to existing issue #${issueNumber}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Live systems validation failure: ${timestamp.split('T')[0]}`,
                labels: [label],
                body: [
                  '## Live Systems Validation Failure',
                  '',
                  `**First detected:** ${timestamp}`,
                  `**Run:** ${runUrl}`,
                  `**Failed checks:** ${failures.length}`,
                  '',
                  '### Failed Checks',
                  '',
                  failureList,
                  '',
                  '---',
                  `*This issue was automatically created by the [live-systems-validation](${runUrl}) workflow. It will receive comments on subsequent failures. Close this issue once the failures are resolved.*`,
                ].join('\n')
              });
              core.info('Created new failure issue');
            }
