name: macOS Build

on:
  push:
    branches: [ main ]
    paths:
      # Swift source files
      - 'app/Sources/**/*.swift'
      - 'Contextify/**/*.swift'
      - 'Tests/**/*.swift'
      # Package manifests
      - 'Package.swift'
      - 'Package.resolved'
      # CI config and QA scripts
      - '.github/workflows/macos-build.yml'
      - 'scripts/qa/**/*.sh'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/Sources/**/*.swift'
      - 'Contextify/**/*.swift'
      - 'Tests/**/*.swift'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/macos-build.yml'
      - 'scripts/qa/**/*.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Select Xcode
        run: |
          sudo xcode-select -p
          xcodebuild -version

      - name: Install coreutils (for gtimeout)
        run: brew install coreutils

      - name: Run Tests
        run: swift test

      - name: Build Contextify
        run: |
          set -euo pipefail
          xcodebuild \
            -project Contextify/Contextify.xcodeproj \
            -scheme Contextify \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derived-dmg \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1
        env:
          NSUnbufferedIO: "YES"

      - name: Create test project
        run: |
          mkdir -p /tmp/contextify-qa-test
          cd /tmp/contextify-qa-test
          git init
          git config user.email "qa@contextify.test"
          git config user.name "QA Test"
          echo "# QA Test Project" > README.md
          git add README.md
          git commit -m "Initial commit"

      - name: Run QA Suite (fixture mode)
        run: |
          QA_FIXTURE_MODE=1 ./scripts/qa/run-all-tests.sh --skip-appstore
        env:
          TEST_PROJECT: /tmp/contextify-qa-test

      - name: Upload QA logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qa-logs
          path: /tmp/qa-run-*

      - name: Archive build logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-logs
          path: .derived-dmg

