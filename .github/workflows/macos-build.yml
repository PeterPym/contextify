name: macOS Build

on:
  push:
    branches: [ main ]
    paths:
      # Swift source files
      - 'app/Sources/**/*.swift'
      - 'Contextify/**/*.swift'
      - 'Tests/**/*.swift'
      # Package manifests
      - 'Package.swift'
      - 'Package.resolved'
      # CI config
      - '.github/workflows/macos-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/Sources/**/*.swift'
      - 'Contextify/**/*.swift'
      - 'Tests/**/*.swift'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/macos-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Select Xcode
        run: |
          sudo xcode-select -p
          xcodebuild -version

      - name: Run Tests
        run: swift test

      - name: Build Contextify
        run: |
          set -euo pipefail
          xcodebuild \
            -project Contextify/Contextify.xcodeproj \
            -scheme Contextify \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .derived-dmg \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1
        env:
          NSUnbufferedIO: "YES"

      # Note: QA E2E tests removed from CI - they require macOS GUI environment
      # (launching app, UI automation via AppleScript, Accessibility permissions)
      # which is not available in headless GitHub Actions runners.
      # Run QA suite locally: ./scripts/qa/run-all-tests.sh

