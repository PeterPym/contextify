name: macOS Build

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'Contextify/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/macos-build.yml'
      - 'scripts/qa/**'
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'Contextify/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/macos-build.yml'
      - 'scripts/qa/**'
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Select Xcode
        run: |
          sudo xcode-select -p
          xcodebuild -version

      - name: Install coreutils (for gtimeout)
        run: brew install coreutils

      - name: Run Tests
        run: swift test

      - name: Build Contextify
        run: |
          set -euo pipefail
          xcodebuild \
            -project Contextify/Contextify.xcodeproj \
            -scheme Contextify \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .derived-dmg \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            build | xcpretty || exit ${PIPESTATUS[0]}
        env:
          NSUnbufferedIO: "YES"

      - name: Create test project
        run: |
          mkdir -p /tmp/contextify-qa-test
          cd /tmp/contextify-qa-test
          git init
          git config user.email "qa@contextify.test"
          git config user.name "QA Test"
          echo "# QA Test Project" > README.md
          git add README.md
          git commit -m "Initial commit"

      - name: Run QA Suite (fixture mode)
        run: |
          QA_FIXTURE_MODE=1 ./scripts/qa/run-all-tests.sh --skip-appstore
        env:
          TEST_PROJECT: /tmp/contextify-qa-test

      - name: Upload QA logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-logs
          path: /tmp/qa-run-*

      - name: Archive build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-logs
          path: .derived-dmg

