name: Linux Release

on:
  push:
    tags:
      - 'cli-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true

env:
  SQLITE_VERSION: "3450100"

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # For version detection

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Extract from tag (cli-v1.0.0 -> 1.0.0)
            echo "version=${GITHUB_REF_NAME#cli-v}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build for x86_64
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace:rw \
            -e CLI_VERSION="${{ steps.version.outputs.version }}" \
            -w /workspace \
            --platform linux/amd64 \
            swift:6.0-noble \
            bash -c '
              set -e

              # Install build dependencies
              apt-get update -qq
              apt-get install -y build-essential curl pkg-config -qq > /dev/null 2>&1

              # Build SQLite with ENABLE_SNAPSHOT
              cd /tmp
              curl -sL "https://www.sqlite.org/2024/sqlite-autoconf-${{ env.SQLITE_VERSION }}.tar.gz" | tar xz
              cd sqlite-autoconf-*
              CFLAGS="-DSQLITE_ENABLE_SNAPSHOT -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_RTREE -O2" \
                ./configure --prefix=/usr --libdir=/usr/lib/x86_64-linux-gnu --quiet
              make -j$(nproc) --quiet
              make install --quiet
              ldconfig

              # Build CLI
              cd /workspace
              swift build -c release --product contextify-ingest

              # Create tarball
              mkdir -p dist
              cp .build/release/contextify-ingest dist/
              cd dist
              tar -czvf contextify-ingest-linux-x86_64.tar.gz contextify-ingest
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: contextify-ingest-linux-x86_64
          path: dist/contextify-ingest-linux-x86_64.tar.gz

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#cli-v}" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build for arm64
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace:rw \
            -e CLI_VERSION="${{ steps.version.outputs.version }}" \
            -w /workspace \
            --platform linux/arm64 \
            swift:6.0-noble \
            bash -c '
              set -e

              # Install build dependencies
              apt-get update -qq
              apt-get install -y build-essential curl pkg-config -qq > /dev/null 2>&1

              # Build SQLite with ENABLE_SNAPSHOT
              cd /tmp
              curl -sL "https://www.sqlite.org/2024/sqlite-autoconf-${{ env.SQLITE_VERSION }}.tar.gz" | tar xz
              cd sqlite-autoconf-*
              CFLAGS="-DSQLITE_ENABLE_SNAPSHOT -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_RTREE -O2" \
                ./configure --prefix=/usr --libdir=/usr/lib/aarch64-linux-gnu --quiet
              make -j$(nproc) --quiet
              make install --quiet
              ldconfig

              # Build CLI
              cd /workspace
              swift build -c release --product contextify-ingest

              # Create tarball
              mkdir -p dist
              cp .build/release/contextify-ingest dist/
              cd dist
              tar -czvf contextify-ingest-linux-arm64.tar.gz contextify-ingest
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: contextify-ingest-linux-arm64
          path: dist/contextify-ingest-linux-arm64.tar.gz

  create-release:
    needs: [build-linux-amd64, build-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=cli-v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#cli-v}" >> $GITHUB_OUTPUT
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: CLI v${{ steps.version.outputs.version }}
          body: |
            ## Contextify Ingest CLI v${{ steps.version.outputs.version }}

            Linux CLI for ingesting Claude Code and Codex transcripts into a SQLite database.

            ### Installation

            ```bash
            # x86_64
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/contextify-ingest-linux-x86_64.tar.gz | tar xz
            sudo mv contextify-ingest /usr/local/bin/

            # arm64
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/contextify-ingest-linux-arm64.tar.gz | tar xz
            sudo mv contextify-ingest /usr/local/bin/
            ```

            ### Usage

            ```bash
            contextify-ingest ingest --db ~/contextify.db
            contextify-ingest verify --db ~/contextify.db
            ```

            ### Schema Version

            This CLI requires database schema version ${{ env.SQLITE_VERSION }} or compatible.
          files: |
            artifacts/contextify-ingest-linux-x86_64/contextify-ingest-linux-x86_64.tar.gz
            artifacts/contextify-ingest-linux-arm64/contextify-ingest-linux-arm64.tar.gz
          draft: false
          prerelease: false
