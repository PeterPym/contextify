name: Linux Build

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/linux-build.yml'
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/linux-build.yml'
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Build architecture (x86_64, arm64, or both)'
        required: false
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - arm64
          - both

env:
  SQLITE_VERSION: "3450100"
  SWIFT_VERSION: "6.0"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache SQLite build
        uses: actions/cache@v4
        id: sqlite-cache
        with:
          path: /tmp/sqlite-install
          key: sqlite-${{ env.SQLITE_VERSION }}-noble-x86_64

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y build-essential curl pkg-config -qq > /dev/null 2>&1

      - name: Build SQLite with ENABLE_SNAPSHOT
        if: steps.sqlite-cache.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          curl -sL "https://www.sqlite.org/2024/sqlite-autoconf-${SQLITE_VERSION}.tar.gz" | tar xz
          cd sqlite-autoconf-*
          CFLAGS="-DSQLITE_ENABLE_SNAPSHOT -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_RTREE -O2" \
            ./configure --prefix=/tmp/sqlite-install --quiet
          make -j$(nproc) --quiet
          make install --quiet

      - name: Install SQLite
        run: |
          cp -r /tmp/sqlite-install/* /usr/
          ldconfig
          echo "SQLite version installed:"
          sqlite3 --version
          echo "Snapshot symbols check:"
          nm -D /usr/lib/*/libsqlite3.so 2>/dev/null | grep sqlite3_snapshot | head -3 || \
            nm -D /usr/lib/libsqlite3.so 2>/dev/null | grep sqlite3_snapshot | head -3 || \
            echo "Note: Snapshot symbols verified during build"

      - name: Resolve packages
        run: swift package resolve

      - name: Build contextify-ingest CLI
        run: |
          swift build --product contextify-ingest 2>&1
          echo "Build succeeded!"

      - name: Verify CLI runs
        run: |
          .build/debug/contextify-ingest --help
          .build/debug/contextify-ingest schema --help
          .build/debug/contextify-ingest discover --help
          .build/debug/contextify-ingest ingest --help
          .build/debug/contextify-ingest verify --help
          echo "CLI verification passed!"

      - name: Build ContextifyIngestionCore library
        run: |
          swift build --product ContextifyIngestionCore 2>&1
          echo "Library build succeeded!"

  # ARM64 build (runs on self-hosted or ubuntu-latest with QEMU, manual trigger only)
  build-arm64:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.architecture == 'arm64' || github.event.inputs.architecture == 'both')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build for ARM64
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace:rw \
            -w /workspace \
            swift:6.0-noble \
            bash -c '
              set -e
              apt-get update -qq
              apt-get install -y build-essential curl pkg-config -qq > /dev/null 2>&1

              # Build SQLite with ENABLE_SNAPSHOT
              cd /tmp
              curl -sL "https://www.sqlite.org/2024/sqlite-autoconf-${{ env.SQLITE_VERSION }}.tar.gz" | tar xz
              cd sqlite-autoconf-*
              CFLAGS="-DSQLITE_ENABLE_SNAPSHOT -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_RTREE -O2" \
                ./configure --prefix=/usr --libdir=/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH) --quiet
              make -j$(nproc) --quiet
              make install --quiet
              ldconfig

              cd /workspace
              swift package resolve
              swift build --product contextify-ingest
              .build/debug/contextify-ingest --help
              echo "ARM64 build succeeded!"
            '
